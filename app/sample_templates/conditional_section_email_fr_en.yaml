example_content: |
  [[en]]
  *The English version follows*
  [[/en]]

  [[fr]]
  Bonjour Jane Smith,

  Merci d’avoir soumis votre demande. Votre numéro de référence est A123456789.

  # Documents requis

  Il nous manque des documents pour compléter votre demande. Veuillez nous faire parvenir les documents suivants dès que possible :

  * Preuve d’adresse
  * Pièce d’identité avec photo délivrée par le gouvernement
  * Formulaire de consentement signé

  Vous pouvez téléverser ces documents en vous connectant à votre compte.

  Nous communiquerons avec vous une fois votre demande traitée.
  [[/fr]]

  ---

  [[en]]
  Hi Jane Smith,

  Thank you for submitting your application. Your reference number is A123456789.

  # Documents required

  We’re missing some documents to complete your application. Please send us the following as soon as possible:

  * Proof of address
  * Government-issued photo ID
  * Signed consent form

  You can upload these documents by signing in to your account.

  We’ll be in touch once your application has been processed.
  [[/en]]
