{# Storybook: Bilingual template editor prototype, one Tiptap editor per language #}

<style>
  .bte { max-width: 100%; }
  .bte[data-mode="en"], .bte[data-mode="fr"] { max-width: 670px; }
  .bte-row { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
  .bte-field { margin-bottom: 1.5rem; }
  .bte-field .form-control { width: 100%; }
  .bte-subjects { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
  .bte[data-mode="en"] .bte-subjects, .bte[data-mode="fr"] .bte-subjects { grid-template-columns: 1fr; }
  .bte[data-mode="bilingual"] .bte-row, .bte[data-mode="bilingual"] .bte-subjects { grid-template-columns: repeat(2, minmax(0, 668px)); gap: 0; }
  .bte[data-mode="bilingual"] .bte-row > :first-child, .bte[data-mode="bilingual"] .bte-subjects > :first-child { padding-right: 1rem; }
  .bte .editor-content { position: relative; }
  .bte .editor-content > div.sr-only { width: 1px; }
  .bte-pane.has-error .editor-content { box-shadow: inset 4px 0 0 #d3080c; }
  .bte-pane-label { display: block; font-weight: 700; margin-bottom: .5rem; }

  /* Bilingual: flatten both editors into one bordered grid with a single (active) toolbar */
  .bte[data-mode="bilingual"] .bte-panes {
    display: grid; grid-template-columns: 666px 666px; width: max-content; max-width: 100%;
    position: relative; overflow-x: auto; background: #fff; border: 2px solid #0d0d0d;
  }
  .bte[data-mode="bilingual"] .bte-panes:focus-within { box-shadow: 0 0 0 3px #ffbf47; }
  .bte[data-mode="bilingual"] .bte-pane,
  .bte[data-mode="bilingual"] .bte-pane > div,
  .bte[data-mode="bilingual"] .editor-wrapper { display: contents; }
  .bte[data-mode="bilingual"] .toolbar { grid-row: 1; grid-column: 1 / -1; }
  .bte[data-mode="bilingual"] .info-pane { grid-row: 2; grid-column: 1 / -1; }
  .bte[data-mode="bilingual"] .bte-pane-label { grid-row: 3; margin: 0; padding: 1rem 1.875rem 0; }
  .bte[data-mode="bilingual"] .editor-content { grid-row: 4; min-height: 320px; overflow: visible; }
  .bte[data-mode="bilingual"] .editor-content > div:not(.sr-only) { padding-top: 1rem; height: 100%; }
  .bte[data-mode="bilingual"] [data-lang="en"] > .bte-pane-label { grid-column: 1; border-right: 1px dashed #b1b9c3; }
  .bte[data-mode="bilingual"] [data-lang="en"] .editor-content { grid-column: 1; }
  .bte[data-mode="bilingual"] [data-lang="fr"] > .bte-pane-label,
  .bte[data-mode="bilingual"] [data-lang="fr"] .editor-content { grid-column: 2; }
  .bte[data-mode="bilingual"][data-active="en"] [data-lang="fr"] :is(.toolbar, .info-pane),
  .bte[data-mode="bilingual"][data-active="fr"] [data-lang="en"] :is(.toolbar, .info-pane) { display: none; }
  /* The combined box scrolls horizontally, which would clip tooltips above the toolbar, so open them below */
  .bte[data-mode="bilingual"] .rte-tooltip-box { bottom: auto; top: calc(100% + 8px); }
  .bte[data-mode="bilingual"] .rte-tooltip-caret { bottom: auto; top: -6px; border-top: 0; border-bottom: 6px solid #111827; }
  .bte[data-mode="bilingual"] .toolbar > .toolbar-group:nth-child(2) > .rte-tooltip-wrapper:first-child .rte-tooltip-box { left: 0; transform: none; }
  .bte[data-mode="bilingual"] .toolbar > .toolbar-group:nth-child(2) > .rte-tooltip-wrapper:first-child .rte-tooltip-caret { left: 18px; }

  .bte[data-mode="en"] [data-lang="fr"], .bte[data-mode="fr"] [data-lang="en"] { display: none; }
  .bte[data-mode="en"] .bte-pane-label, .bte[data-mode="fr"] .bte-pane-label {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .bte-notice { border-left: 5px solid #26374a; background: #f1f2f3; padding: .75rem 1rem; margin-bottom: 1.5rem; }
  .bte-errors { border: 4px solid #d3080c; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
  .bte-errors a { color: #d3080c; text-decoration: underline; }
  .bte .error-message { display: block; color: #d3080c; font-weight: 700; margin-bottom: .25rem; }
</style>

<h2 class="heading-medium">Bilingual template editor (prototype)</h2>

<form class="bte" id="bte" data-mode="bilingual" novalidate>
  <div id="bte-errors" class="bte-errors" tabindex="-1" hidden>
    <h3 class="heading-small">There is a problem</h3>
    <ul class="list list-bullet" id="bte-errors-list"></ul>
  </div>

  <div class="bte-row">
    <div class="bte-field">
      <label class="form-label" for="bte-name">Template name</label>
      <input class="form-control" id="bte-name" type="text" value="Welcome email">
    </div>
    <div class="bte-field">
      <label class="form-label" for="bte-language">Template language</label>
      <select class="form-control" id="bte-language">
        <option value="bilingual" selected>Bilingual</option>
        <option value="en">English only</option>
        <option value="fr">French only</option>
      </select>
    </div>
  </div>

  <div id="bte-hidden-notice" class="bte-notice" role="status" aria-live="polite" hidden></div>

  <div class="bte-subjects">
    <div class="bte-field" data-lang="en">
      <label class="form-label" for="bte-subject-en">Subject <span class="bte-lang-suffix">(English)</span></label>
      <span class="error-message" id="bte-subject-en-error" hidden></span>
      <input class="form-control" id="bte-subject-en" type="text" value="Welcome to GC Notify">
    </div>
    <div class="bte-field" data-lang="fr">
      <label class="form-label" for="bte-subject-fr">Subject <span class="bte-lang-suffix">(French)</span></label>
      <span class="error-message" id="bte-subject-fr-error" hidden></span>
      <input class="form-control" id="bte-subject-fr" type="text" lang="fr" value="Bienvenue sur GC Notify">
    </div>
  </div>

  <div class="bte-field">
    <span class="form-label" id="bte-content-label">Template content</span>
    <span class="error-message" id="bte-content-error" hidden></span>
    <div class="bte-panes" role="group" aria-labelledby="bte-content-label">
      <div class="bte-pane" data-lang="en" lang="en">
        <span class="bte-pane-label" id="bte-content-en-label">English</span>
        <div id="tiptap-editor-bte-content-en"></div>
        <input type="hidden" id="bte-content-en">
      </div>
      <div class="bte-pane" data-lang="fr" lang="fr">
        <span class="bte-pane-label" id="bte-content-fr-label">French</span>
        <div id="tiptap-editor-bte-content-fr"></div>
        <input type="hidden" id="bte-content-fr">
      </div>
    </div>
  </div>

  <button type="submit" class="button">Save and send</button>
  <button type="button" class="button button-secondary ml-4" id="bte-reset">Reset to example</button>
</form>

<script nonce="{{ request_nonce }}">
  (function () {
    var form = document.getElementById("bte");
    var select = document.getElementById("bte-language");
    var notice = document.getElementById("bte-hidden-notice");
    var errorsBox = document.getElementById("bte-errors");
    var errorsList = document.getElementById("bte-errors-list");
    var LANG_NAMES = { en: "English", fr: "French" };
    // Bump the version when the example content changes so older saves are ignored
    var STORAGE_KEY = "notify-bilingual-prototype-template-v2";

    function el(id) { return document.getElementById(id); }
    function val(id) { return el(id).value.trim(); }

    function variables(text) {
      var found = [], re = /\(\(([^()]+?)\)\)/g, m;
      while ((m = re.exec(text))) {
        var name = m[1].trim().replace(/\?\?.*$/, "");
        if (found.indexOf(name) === -1) found.push(name);
      }
      return found.sort();
    }

    function setMode(mode) {
      form.dataset.mode = mode;
      form.dataset.active = mode === "bilingual" ? (form.dataset.active || "en") : mode;
      var bilingual = mode === "bilingual";
      Array.prototype.forEach.call(form.querySelectorAll(".bte-lang-suffix"), function (s) { s.hidden = !bilingual; });
      clearErrors();

      var other = mode === "en" ? "fr" : mode === "fr" ? "en" : null;
      if (other && (val("bte-subject-" + other) || val("bte-content-" + other))) {
        notice.textContent = "This template has " + LANG_NAMES[other] + " content. It’s hidden while the template is "
          + LANG_NAMES[mode] + " only, and would be removed when you save.";
        notice.hidden = false;
      } else {
        notice.hidden = true;
        notice.textContent = "";
      }
    }

    function activeLangs() {
      var mode = form.dataset.mode;
      return mode === "bilingual" ? ["en", "fr"] : [mode];
    }

    function showFieldError(id, message) {
      var err = el(id + "-error");
      err.textContent = message;
      err.hidden = false;
    }

    function clearErrors() {
      errorsBox.hidden = true;
      errorsList.innerHTML = "";
      Array.prototype.forEach.call(form.querySelectorAll(".error-message"), function (e) { e.hidden = true; e.textContent = ""; });
      Array.prototype.forEach.call(form.querySelectorAll(".form-control-error"), function (e) { e.classList.remove("form-control-error"); });
      Array.prototype.forEach.call(form.querySelectorAll(".bte-pane.has-error"), function (e) { e.classList.remove("has-error"); });
    }

    function focusTarget(id) {
      var target = el(id);
      if (target.type === "hidden") {
        target = target.closest(".bte-pane").querySelector(".ProseMirror, textarea") || target;
      }
      target.focus();
    }

    function validate() {
      var errors = [];
      var langs = activeLangs();
      var bilingual = langs.length === 2;
      var contentMessages = [];

      langs.forEach(function (lang) {
        var suffix = bilingual ? " in " + LANG_NAMES[lang] : "";
        if (!val("bte-subject-" + lang)) {
          var msg = "Enter a subject" + suffix;
          errors.push({ target: "bte-subject-" + lang, message: msg });
          showFieldError("bte-subject-" + lang, msg);
          el("bte-subject-" + lang).classList.add("form-control-error");
        }
        if (!val("bte-content-" + lang)) {
          var cmsg = "Enter template content" + suffix;
          errors.push({ target: "bte-content-" + lang, message: cmsg });
          contentMessages.push(cmsg);
          el("bte-content-" + lang).closest(".bte-pane").classList.add("has-error");
        }
      });

      if (bilingual && val("bte-content-en") && val("bte-content-fr")) {
        var en = variables(el("bte-content-en").value + " " + el("bte-subject-en").value);
        var fr = variables(el("bte-content-fr").value + " " + el("bte-subject-fr").value);
        var onlyEn = en.filter(function (v) { return fr.indexOf(v) === -1; });
        var onlyFr = fr.filter(function (v) { return en.indexOf(v) === -1; });
        if (onlyEn.length) {
          var m1 = "Add ((" + onlyEn.join(")), ((") + ")) to the French version, or remove it from the English version";
          errors.push({ target: "bte-content-fr", message: m1 });
          contentMessages.push(m1);
          el("bte-content-fr").closest(".bte-pane").classList.add("has-error");
        }
        if (onlyFr.length) {
          var m2 = "Add ((" + onlyFr.join(")), ((") + ")) to the English version, or remove it from the French version";
          errors.push({ target: "bte-content-en", message: m2 });
          contentMessages.push(m2);
          el("bte-content-en").closest(".bte-pane").classList.add("has-error");
        }
      }

      if (contentMessages.length) {
        showFieldError("bte-content", contentMessages.join(". "));
      }
      return errors;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      clearErrors();

      var errors = validate();
      if (errors.length) {
        errors.forEach(function (e) {
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = "#" + e.target;
          a.textContent = e.message;
          a.addEventListener("click", function (ev) { ev.preventDefault(); focusTarget(e.target); });
          li.appendChild(a);
          errorsList.appendChild(li);
        });
        errorsBox.hidden = false;
        errorsBox.focus();
        return;
      }

      var mode = form.dataset.mode;
      var payload = { name: val("bte-name"), template_type: "email", language: mode };
      activeLangs().forEach(function (lang) {
        payload["subject_" + lang] = val("bte-subject-" + lang);
        payload["content_" + lang] = el("bte-content-" + lang).value;
      });
      try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) { /* storage unavailable */ }
      window.location.href = "{{ url_for('main.storybook', component='bilingual-send-preview') }}";
    });

    var initialContent = {
      en: "# 👋 Welcome to GC Notify!\n\nThank you for signing up, ((name))! We’re thrilled to have you on board. In order to finish creating your account, please confirm your email address:\n\n^ [Confirm your email address](https://notification.canada.ca/)",
      fr: "# 👋 Bienvenue sur GC Notify !\n\nMerci de vous être inscrit(e), ((name)) ! Nous sommes ravis de vous compter parmi nous. Pour finaliser la création de votre compte, veuillez confirmer votre adresse e-mail :\n\n^ [Confirmer votre adresse e-mail](https://notification.canada.ca/)"
    };

    // Restore a template saved earlier in this tab (shared with the send preview prototype)
    var saved = null;
    try { saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }
    if (saved) {
      el("bte-name").value = saved.name || "";
      select.value = saved.language || "bilingual";
      ["en", "fr"].forEach(function (lang) {
        el("bte-subject-" + lang).value = saved["subject_" + lang] || "";
        initialContent[lang] = saved["content_" + lang] || "";
      });
    }

    el("bte-reset").addEventListener("click", function () {
      try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) { /* storage unavailable */ }
      window.location.reload();
    });

    function mountEditors() {
      ["en", "fr"].forEach(function (lang) {
        var id = "bte-content-" + lang;
        window.Tiptap.load(el("tiptap-editor-" + id), id, id + "-label", initialContent[lang], "{{ current_lang }}", "", "rte", "", "{{ csrf_token() }}", "email");
      });
    }

    select.addEventListener("change", function () { setMode(select.value); });
    // The visible (shared) toolbar belongs to whichever language pane last had focus
    form.querySelector(".bte-panes").addEventListener("focusin", function (event) {
      var pane = event.target.closest(".bte-pane");
      if (pane && form.dataset.mode === "bilingual") form.dataset.active = pane.dataset.lang;
    });
    ["en", "fr"].forEach(function (lang) {
      el("bte-content-" + lang).value = initialContent[lang];
    });
    setMode(select.value);

    if (window.Tiptap) {
      mountEditors();
    } else {
      var script = document.createElement("script");
      script.type = "module";
      script.nonce = "{{ request_nonce }}";
      script.src = "{% if vite_dev_server %}http://localhost:5173/app/assets/javascripts/tiptap/editor.js{% else %}{{ asset_url('javascripts/tiptap.min.js') }}{% endif %}";
      script.onload = function () { window.tiptapLoaded = true; mountEditors(); };
      document.head.appendChild(script);
    }
  })();
</script>
