{# Storybook: Send flow preview step for bilingual templates (prototype) #}

<style>
  .bsp { display: grid; grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); gap: 2.5rem; align-items: start; }
  .bsp-choice { position: sticky; top: 1rem; }
  .bsp-highlight { background: #fff7dc; border-left: 6px solid #ffbf47; padding: 1.25rem 1.25rem .75rem; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .bsp-highlight legend + .multiple-choice { margin-top: 1rem; }
  .bsp-highlight .multiple-choice:last-child { margin-bottom: 0; }
  .bsp-hint { display: flex; align-items: center; gap: .625rem; margin-top: .75rem; }
  .bsp-hint .fa-circle-info { flex: none; font-size: 1.25rem; }
  .bsp-preview .email-message-body { padding-top: 0; padding-bottom: 2rem; }
  .bsp-preview .bsp-inner { max-width: 580px; margin: 0 auto; }
  .bsp-preview .bsp-fip { margin: 20px 0 30px; }
  .bsp-preview .bsp-fip img { height: 34px; width: auto; }
  .bsp-preview .bsp-body { padding: 0 10px; }
  .bsp-preview .bsp-body p, .bsp-preview .bsp-body ul, .bsp-preview .bsp-body ol, .bsp-preview .bsp-body blockquote { margin: 0 0 1rem; }
  .bsp-preview .bsp-body ul { list-style: disc; padding-left: 1.5rem; }
  .bsp-preview .bsp-body ol { list-style: decimal; padding-left: 1.5rem; }
  .bsp-preview .bsp-body blockquote { border-left: 10px solid #bfc1c3; padding: .5rem 0 .5rem 1rem; }
  .bsp-preview .bsp-body hr { border: 0; border-top: 1px solid #b1b9c3; margin: 1.5rem 0; }
  .bsp-preview .bsp-body a { text-decoration: underline; }
  .bsp-preview mark.bsp-var { background: #ffbf47; color: inherit; padding: 0 2px; }
  .bsp-preview .bsp-notice { font-style: italic; }
  .bsp-preview .bsp-divider { border: 0; border-top: 1px solid #b1b9c3; margin: 2.5rem 10px; }
  .bsp-field { margin-bottom: 1.25rem; }
  .bsp-sent { border-left: 5px solid #00703c; background: #f1f2f3; padding: .75rem 1rem; margin-top: 1.25rem; }
  .bsp-plane { position: fixed; width: 44px; height: 44px; z-index: 10000; pointer-events: none; filter: drop-shadow(0 4px 4px rgba(0,0,0,.25)); }
  .bsp-trail { position: fixed; width: 6px; height: 6px; border-radius: 50%; background: #b1b9c3; z-index: 9999; pointer-events: none; }
  @media (max-width: 900px) { .bsp { grid-template-columns: 1fr; } .bsp-choice { position: static; } }
</style>

<p class="mb-4"><a href="{{ url_for('main.storybook', component='bilingual-template-editor') }}" class="text-blue-500 hover:underline">Edit template</a></p>
<h2 class="heading-medium mb-8">Review before sending: <span id="bsp-template-name"></span></h2>

<div class="bsp" id="bsp">
  <div class="bsp-choice">
    <p class="bsp-field" id="bsp-unilingual-note" hidden></p>
    <div class="bsp-highlight" id="bsp-lang-choice">
      <fieldset class="form-group mb-0">
        <legend class="form-label heading-small">Choose template language</legend>
        <div class="multiple-choice">
          <input class="form-input radio" type="radio" id="bsp-lang-en-fr" name="bsp-lang" value="en-fr" aria-describedby="bsp-hint" checked>
          <label class="block-label w-full" for="bsp-lang-en-fr">Bilingual, English first</label>
        </div>
        <div class="multiple-choice">
          <input class="form-input radio" type="radio" id="bsp-lang-fr-en" name="bsp-lang" value="fr-en" aria-describedby="bsp-hint">
          <label class="block-label w-full" for="bsp-lang-fr-en">Bilingual, French first</label>
        </div>
        <div class="multiple-choice">
          <input class="form-input radio" type="radio" id="bsp-lang-en" name="bsp-lang" value="en" aria-describedby="bsp-hint">
          <label class="block-label w-full" for="bsp-lang-en">English only</label>
        </div>
        <div class="multiple-choice">
          <input class="form-input radio" type="radio" id="bsp-lang-fr" name="bsp-lang" value="fr" aria-describedby="bsp-hint">
          <label class="block-label w-full" for="bsp-lang-fr">French only</label>
        </div>
      </fieldset>
    </div>
    <span class="form-hint bsp-hint" id="bsp-hint"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>If you know the recipient’s preferred language, send in that language only.</span></span>

    <button type="button" class="button mt-6" id="bsp-send">Send 1 email</button>
    <div id="bsp-sent" role="status" aria-live="polite"></div>
  </div>

  <div class="bsp-preview">
    <p class="sr-only" id="bsp-announce" role="status" aria-live="polite"></p>
    <div class="email-message mb-12">
      <table class="email-message-meta mb-12 leading-tight font-normal border border-solid border-gray-grey2">
        <tbody>
          <tr>
            <th class="email-message-table pl-doubleGutter text-gray-grey1" scope="row">From</th>
            <td class="email-message-table">GC Notify</td>
          </tr>
          <tr>
            <th class="email-message-table pl-doubleGutter text-gray-grey1" scope="row">To</th>
            <td class="email-message-table" id="bsp-to-preview">user@example.com</td>
          </tr>
          <tr class="email-message-meta m-0 text-smaller leading-tight font-normal">
            <th class="email-message-table pl-doubleGutter text-gray-grey1" scope="row">Subject</th>
            <td class="email-message-table" id="bsp-subject"></td>
          </tr>
        </tbody>
      </table>

      <div class="email-message-body w-full relative break-words box-border px-doubleGutter border-gray-grey2 border">
        <div class="bsp-inner" id="bsp-body"></div>
      </div>
    </div>
  </div>
</div>

<script nonce="{{ request_nonce }}">
  (function () {
    // Must match the key in the template editor prototype
    var STORAGE_KEY = "notify-bilingual-prototype-template-v2";
    var EXAMPLE = {
      name: "Welcome email",
      language: "bilingual",
      subject_en: "Welcome to GC Notify",
      subject_fr: "Bienvenue sur GC Notify",
      content_en: "# 👋 Welcome to GC Notify!\n\nThank you for signing up, ((name))! We’re thrilled to have you on board. In order to finish creating your account, please confirm your email address:\n\n^ [Confirm your email address](https://notification.canada.ca/)",
      content_fr: "# 👋 Bienvenue sur GC Notify !\n\nMerci de vous être inscrit(e), ((name)) ! Nous sommes ravis de vous compter parmi nous. Pour finaliser la création de votre compte, veuillez confirmer votre adresse e-mail :\n\n^ [Confirmer votre adresse e-mail](https://notification.canada.ca/)"
    };
    var FIP = {
      en: { src: "{{ asset_s3_url('gov-canada-en.svg') }}", alt: "Government of Canada / Gouvernement du Canada" },
      fr: { src: "{{ asset_s3_url('gov-canada-fr.svg') }}", alt: "Gouvernement du Canada / Government of Canada" }
    };
    // Notice shown at the top of the first language, pointing to the second
    var NOTICES = {
      en: { lang: "fr", before: "La ", link: "version française", after: " suit" },
      fr: { lang: "en", before: "The ", link: "English version", after: " follows" }
    };
    var ALL_ORDERS = { "en-fr": ["en", "fr"], "fr-en": ["fr", "en"], en: ["en"], fr: ["fr"] };
    var LABELS = { "en-fr": "bilingual email, English first", "fr-en": "bilingual email, French first", en: "English email", fr: "French email" };

    var template = null;
    try { template = JSON.parse(sessionStorage.getItem(STORAGE_KEY)); } catch (e) { template = null; }
    template = template || EXAMPLE;

    var body = document.getElementById("bsp-body");
    var subject = document.getElementById("bsp-subject");
    var sendButton = document.getElementById("bsp-send");
    var sent = document.getElementById("bsp-sent");
    var TO = "user@example.com";
    // Personalisation happens in an earlier step of the real flow; fake a value for ((name))
    var values = { name: "Alex" };
    var current = template.language === "bilingual" ? "en-fr" : template.language;

    function el(tag, attrs, text) {
      var node = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
      if (text != null) node.textContent = text;
      return node;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
    }

    function parseVariable(raw) {
      var parts = raw.split("??");
      return { name: parts[0].trim(), conditional: parts.length > 1 ? parts.slice(1).join("??") : null };
    }

    function isTruthy(value) {
      return value && ["no", "false", "0", "non", "faux"].indexOf(value.trim().toLowerCase()) === -1;
    }

    // Replace ((variables)) in plain text (used for the subject line)
    function substituteText(text) {
      return (text || "").replace(/\(\(([^()]+?)\)\)/g, function (all, raw) {
        var v = parseVariable(raw), value = values[v.name] || "";
        if (v.conditional !== null) return value ? (isTruthy(value) ? v.conditional : "") : all;
        return value || all;
      });
    }

    // Minimal Notify-flavoured markdown: enough for the prototype preview
    function renderInline(text) {
      var tokens = [];
      function stash(html) { tokens.push(html); return "\u0002" + (tokens.length - 1) + "\u0003"; }
      text = text.replace(/\\([\\`*_{}\[\]()#+\-.!>^~|])/g, function (all, c) { return stash(escapeHtml(c)); });
      text = text.replace(/\(\(([^()]+?)\)\)/g, function (all, raw) {
        var v = parseVariable(raw), value = values[v.name] || "";
        if (!value) return stash('<mark class="bsp-var">' + escapeHtml(all) + "</mark>");
        if (v.conditional !== null) return stash(isTruthy(value) ? escapeHtml(v.conditional) : "");
        return stash(escapeHtml(value));
      });
      text = text.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^)\s]+)\)/g, function (all, label, url) {
        return stash('<a href="' + escapeHtml(url) + '">' + escapeHtml(label) + "</a>");
      });
      text = escapeHtml(text);
      text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      text = text.replace(/(^|[^\w*])[*_]([^*_]+)[*_](?=[^\w*]|$)/g, "$1<em>$2</em>");
      return text.replace(/\u0002(\d+)\u0003/g, function (all, i) { return tokens[+i]; });
    }

    function renderMarkdown(md) {
      var html = [], para = [], list = null, quote = [];
      function flushPara() { if (para.length) { html.push("<p>" + para.map(renderInline).join("<br>") + "</p>"); para = []; } }
      function flushList() { if (list) { html.push("<" + list.type + ">" + list.items.map(function (i) { return "<li>" + renderInline(i) + "</li>"; }).join("") + "</" + list.type + ">"); list = null; } }
      function flushQuote() { if (quote.length) { html.push("<blockquote>" + quote.map(renderInline).join("<br>") + "</blockquote>"); quote = []; } }
      function flushAll() { flushPara(); flushList(); flushQuote(); }

      (md || "").split("\n").forEach(function (rawLine) {
        var line = rawLine.replace(/\s*\\$/, "").replace(/\s+$/, "");
        var m;
        if (!line.trim()) { flushAll(); return; }
        if ((m = line.match(/^(#{1,2})\s+(.*)$/))) {
          flushAll();
          html.push(m[1].length === 1 ? '<h2 class="heading-medium">' + renderInline(m[2]) + "</h2>" : '<h3 class="heading-small">' + renderInline(m[2]) + "</h3>");
        } else if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())) {
          flushAll(); html.push("<hr>");
        } else if ((m = line.match(/^\s*[-*•]\s+(.*)$/)) || (m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
          var type = /^\s*\d/.test(line) ? "ol" : "ul";
          flushPara(); flushQuote();
          if (list && list.type !== type) flushList();
          list = list || { type: type, items: [] };
          list.items.push(m[1]);
        } else if ((m = line.match(/^[\^>]\s?(.*)$/))) {
          flushPara(); flushList(); quote.push(m[1]);
        } else {
          flushList(); flushQuote(); para.push(line);
        }
      });
      flushAll();
      return html.join("");
    }

    function section(lang, notice) {
      var s = el("section", { lang: lang, id: "bsp-" + lang });
      var fip = el("div", { "class": "bsp-fip" });
      fip.appendChild(el("img", { src: FIP[lang].src, alt: FIP[lang].alt }));
      s.appendChild(fip);
      var content = el("div", { "class": "bsp-body" });
      if (notice) {
        var n = NOTICES[lang];
        var p = el("p", { "class": "bsp-notice", lang: n.lang });
        p.appendChild(document.createTextNode(n.before));
        p.appendChild(el("a", { href: "#bsp-" + n.lang }, n.link));
        p.appendChild(document.createTextNode(n.after));
        content.appendChild(p);
      }
      content.insertAdjacentHTML("beforeend", renderMarkdown(template["content_" + lang]));
      s.appendChild(content);
      return s;
    }

    function render(choice, announce) {
      current = choice;
      var order = ALL_ORDERS[choice];
      body.innerHTML = "";
      order.forEach(function (lang, i) {
        if (i > 0) body.appendChild(el("hr", { "class": "bsp-divider" }));
        body.appendChild(section(lang, order.length > 1 && i === 0));
      });
      subject.textContent = order.map(function (lang) { return substituteText(template["subject_" + lang]); }).join(" / ");
      if (announce) document.getElementById("bsp-announce").textContent = "Preview updated: " + LABELS[choice];
    }

    // Header and language options depend on the template's language
    document.getElementById("bsp-template-name").textContent = template.name || "Untitled template";
    if (template.language !== "bilingual") {
      document.getElementById("bsp-lang-choice").hidden = true;
      var note = document.getElementById("bsp-unilingual-note");
      note.textContent = "This template is " + (template.language === "fr" ? "French" : "English") + " only.";
      note.hidden = false;
    }

    Array.prototype.forEach.call(document.querySelectorAll('input[name="bsp-lang"]'), function (radio) {
      radio.addEventListener("change", function () { if (radio.checked) render(radio.value, true); });
    });

    var PLANE_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="44" height="44" fill="#fff" stroke="#26374a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>'
      + '<path d="m21.854 2.147-10.94 10.939"/></svg>';

    function flyPaperPlane(button) {
      if (!document.body.animate || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return Promise.resolve();
      var r = button.getBoundingClientRect();
      var startX = r.left + r.width / 2 - 22, startY = r.top + r.height / 2 - 22;
      var plane = el("div", { "class": "bsp-plane" });
      plane.innerHTML = PLANE_SVG;
      plane.style.left = startX + "px";
      plane.style.top = startY + "px";
      document.body.appendChild(plane);

      var endX = window.innerWidth - startX + 80, endY = -(startY + 120);
      var path = [
        { x: 0, y: 0, r: 0, s: 0.4, o: 0 },
        { x: 10, y: -20, r: -10, s: 1, o: 1 },
        { x: 90, y: -110, r: -5, s: 1, o: 1 },
        { x: 200, y: -150, r: 35, s: 1, o: 1 },
        { x: 260, y: -90, r: 120, s: 1, o: 1 },
        { x: 210, y: -40, r: 220, s: 1, o: 1 },
        { x: 160, y: -110, r: 330, s: 1, o: 1 },
        { x: endX * 0.6, y: endY * 0.6, r: 355, s: 0.8, o: 1 },
        { x: endX, y: endY, r: 360, s: 0.5, o: 0.6 }
      ];
      var keyframes = path.map(function (p) {
        return { transform: "translate(" + p.x + "px," + p.y + "px) rotate(" + p.r + "deg) scale(" + p.s + ")", opacity: p.o };
      });
      var flight = plane.animate(keyframes, { duration: 2200, easing: "cubic-bezier(.45,.05,.55,.95)" });

      // A few fading puffs left behind along the path
      path.slice(1, -1).forEach(function (p, i) {
        setTimeout(function () {
          var puff = el("div", { "class": "bsp-trail" });
          puff.style.left = startX + 19 + p.x + "px";
          puff.style.top = startY + 19 + p.y + "px";
          document.body.appendChild(puff);
          puff.animate([{ opacity: 0.8, transform: "scale(1)" }, { opacity: 0, transform: "scale(2.5)" }], { duration: 900, easing: "ease-out" })
            .finished.then(function () { puff.remove(); });
        }, (i + 1) * (2200 / (path.length - 1)));
      });

      return flight.finished.then(function () { plane.remove(); }, function () { plane.remove(); });
    }

    sendButton.addEventListener("click", function () {
      var to = TO;
      var label = LABELS[current];
      sendButton.disabled = true;
      sent.innerHTML = "";
      flyPaperPlane(sendButton).then(function () {
        sendButton.disabled = false;
        var box = el("div", { "class": "bsp-sent" });
        box.appendChild(el("strong", {}, "Sent!"));
        box.appendChild(el("p", { "class": "mb-0 mt-2" }, "Your " + label + " is on its way to " + to + ". (Prototype: nothing was actually sent.)"));
        sent.appendChild(box);
      });
    });

    var initialRadio = document.getElementById("bsp-lang-" + current);
    if (initialRadio) initialRadio.checked = true;
    render(current);
  })();
</script>
